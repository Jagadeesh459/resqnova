# ==============================================================================
# Render Blueprint Specification for ResQNova
# Deploy with 1 click via Render Dashboard -> Blueprints -> Connect Repository
# ==============================================================================

services:
  - type: web
    name: resqnova
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: GEMINI_API_KEY
        sync: false

